<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a7d89">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TCI Tab">

<title>TCI Tab</title>
<style>
/* Layout: one phone column. Trip total on top, two tabs (Expenses / Settle up), floating Add button, bottom sheets for add and edit. */
:root{
  --bg:#edf3f3; --card:#ffffff; --fg:#0f1f20; --muted:#5a6e6f; --line:#d6e1e1;
  --accent:#0a7d89; --accent-fg:#ffffff; --accent-soft:#d8eff1;
  --pos:#12744a; --neg:#b4432d; --chip:#e4eded; --warn:#8a5a00; --warn-bg:#fff2d6;
  --shadow:0 1px 2px rgba(10,40,45,.08),0 10px 28px rgba(10,40,45,.10);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1314; --card:#122122; --fg:#e8f1f1; --muted:#8fa7a8; --line:#223738;
  --accent:#3cc3d0; --accent-fg:#04282c; --accent-soft:#12393d;
  --pos:#4cc98a; --neg:#f08a72; --chip:#1b2f30; --warn:#f2c46b; --warn-bg:#3a2e12; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1314; --card:#122122; --fg:#e8f1f1; --muted:#8fa7a8; --line:#223738;
  --accent:#3cc3d0; --accent-fg:#04282c; --accent-soft:#12393d;
  --pos:#4cc98a; --neg:#f08a72; --chip:#1b2f30; --warn:#f2c46b; --warn-bg:#3a2e12; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 110px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 0 14px}
.top h1{font-size:26px;letter-spacing:-.02em}
.top .sub{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.list{display:flex;flex-direction:column;gap:10px}
.exp{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 12px;width:100%;text-align:left}
.exp .th{width:48px;height:48px;border-radius:10px;background:var(--accent-soft);object-fit:cover;display:grid;place-items:center;color:var(--accent);font-weight:700}
.exp .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp .m{color:var(--muted);font-size:13px;min-width:0}
.exp .a{font-weight:700;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--warn-bg);color:var(--warn);margin-left:6px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:6px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-fg);border:0;border-radius:99px;padding:15px 28px;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:5}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .n{font-weight:600}.row .d{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.net{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.xfer{padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.xfer .who{font-weight:600}.xfer .amt{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
textarea.out{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px;resize:vertical}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(5,15,16,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94vh;max-height:94dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet h2{font-size:20px}
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
input[type=text],input[inputmode],textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;min-width:0}
textarea{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:8px 14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.sm{padding:5px 10px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:600}
.primary{width:100%;background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:15px;font-weight:700;font-size:16px;margin-top:10px}
.primary[disabled]{opacity:.6}
.danger{color:var(--neg)}
.photos{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prev{display:flex;gap:10px;align-items:center;margin-top:10px}
.prev img{width:64px;height:64px;border-radius:10px;object-fit:cover}
.banner{background:var(--accent-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.item{padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.item .r{display:grid;grid-template-columns:1fr 92px auto;gap:8px;align-items:center}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;padding:4px 8px}
.shares{padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;max-width:90vw;font-size:14px}
.err{color:var(--neg);font-size:14px;min-height:1px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>TCI Tab</h1><div class="sub" id="sub"></div></div>
    <button class="iconbtn" data-act="settings">Settings</button>
  </div>
  <div class="seg" role="tablist">
    <button data-act="tab" data-v="exp" id="tabExp" class="on">Expenses</button>
    <button data-act="tab" data-v="settle" id="tabSettle">Settle up</button>
  </div>
  <div id="view"></div>
</div>
<button class="fab" data-act="add">+ Add expense</button>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = c => (c < 0 ? "-" : "") + "$" + (Math.abs(c) / 100).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const toC = s => { const n = parseFloat(String(s ?? "").replace(/[^0-9.\-]/g, "")); return isFinite(n) ? Math.round(n * 100) : 0; };
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); return true; } catch { return false; } }
};
const DEFAULT_PEOPLE = ["Jordan", "Matt", "Justin", "Dad"];
let S = (() => { try { const s = JSON.parse(LS.get("tcitab.v1")); if (s && s.people && s.expenses) return s; } catch {} return {people: [...DEFAULT_PEOPLE], expenses: [], lastPayer: null}; })();
let DB = null, synced = {}, queue = Promise.resolve();
const save = () => { LS.set("tcitab.v1", JSON.stringify(S)); syncDb(); };
function syncDb(){
  if (!DB) return;
  queue = queue.then(async () => {
    try {
      const cur = {people: JSON.stringify({people: S.people, lastPayer: S.lastPayer})};
      for (const e of S.expenses) cur["e" + e.id] = JSON.stringify(e);
      for (const k in cur) if (synced[k] !== cur[k]){
        await (k === "people" ? DB.doc("settings/main") : DB.doc("expenses/" + k.slice(1))).set({v: cur[k]});
        synced[k] = cur[k];
      }
      for (const k in synced) if (!(k in cur)){ await DB.doc("expenses/" + k.slice(1)).delete(); delete synced[k]; }
    } catch { toast("Could not save online. Check your connection."); }
  });
}
async function loadDb(){
  try {
    if (!window.claude) return;
    const db = await window.claude.use("db"); if (!db) return;
    const [snap, st] = await Promise.all([db.collection("expenses").get(), db.doc("settings/main").get()]);
    const remote = snap.docs.map(d => JSON.parse(d.data().v));
    remote.forEach(e => { synced["e" + e.id] = JSON.stringify(e); });
    if (st.exists){ const m = JSON.parse(st.data().v); S.people = m.people; S.lastPayer = m.lastPayer; synced.people = st.data().v; }
    const have = new Set(remote.map(e => e.id));
    S.expenses = [...remote, ...S.expenses.filter(e => !have.has(e.id))];
    DB = db; LS.set("tcitab.v1", JSON.stringify(S)); render(); syncDb();
  } catch { toast("Could not reach online storage. Saving on this phone only."); }
}
let tab = "exp", SAMPLE = null;

/* ---------- money math (cents, largest remainder) ---------- */
function alloc(amount, weights){
  const W = weights.reduce((a, b) => a + b, 0);
  if (!W) return weights.map(() => 0);
  const sign = amount < 0 ? -1 : 1, A = Math.abs(amount);
  const parts = weights.map((w, i) => ({i, base: Math.floor(A * w / W), rem: (A * w) % W}));
  const left = A - parts.reduce((a, p) => a + p.base, 0);
  [...parts].sort((a, b) => b.rem - a.rem).slice(0, left).forEach(p => p.base++);
  return parts.map(p => p.base * sign);
}
function shares(e){
  const P = S.people, who = (e.who && e.who.length) ? e.who : P;
  const out = Object.fromEntries(P.map(p => [p, 0])), sub = {...out};
  if (!e.items.length){ alloc(e.totalC, who.map(() => 1)).forEach((c, i) => out[who[i]] += c); return out; }
  let itemsSum = 0;
  for (const it of e.items){
    const g = (it.who && it.who.length) ? it.who : who;
    itemsSum += it.priceC;
    alloc(it.priceC, g.map(() => 1)).forEach((c, i) => { sub[g[i]] += c; });
  }
  const extra = e.totalC - itemsSum;
  const ws = P.map(p => Math.max(sub[p], 0));
  const ex = ws.some(w => w > 0) ? alloc(extra, ws) : alloc(extra, P.map(p => who.includes(p) ? 1 : 0));
  P.forEach((p, i) => { out[p] = sub[p] + ex[i]; });
  return out;
}
function balances(){
  const P = S.people, paid = Object.fromEntries(P.map(p => [p, 0])), share = {...paid};
  for (const e of S.expenses){
    if (!P.includes(e.payer)) continue;
    paid[e.payer] += e.totalC;
    const sh = shares(e); P.forEach(p => { share[p] += sh[p]; });
  }
  const net = Object.fromEntries(P.map(p => [p, paid[p] - share[p]]));
  const cred = P.filter(p => net[p] > 0).map(p => ({p, c: net[p]})).sort((a, b) => b.c - a.c);
  const debt = P.filter(p => net[p] < 0).map(p => ({p, c: -net[p]})).sort((a, b) => b.c - a.c);
  const xf = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length){
    const m = Math.min(debt[i].c, cred[j].c);
    if (m > 0) xf.push({from: debt[i].p, to: cred[j].p, c: m});
    debt[i].c -= m; cred[j].c -= m;
    if (!debt[i].c) i++; if (!cred[j].c) j++;
  }
  return {paid, share, net, xf};
}

/* ---------- main views ---------- */
function render(){
  const total = S.expenses.reduce((a, e) => a + e.totalC, 0);
  $("#sub").textContent = S.expenses.length ? `${S.expenses.length} expense${S.expenses.length > 1 ? "s" : ""} · ${fmt(total)} total` : "Nothing added yet";
  if (DB) $("#sub").textContent += " · saved online";
  $("#tabExp").classList.toggle("on", tab === "exp");
  $("#tabSettle").classList.toggle("on", tab === "settle");
  $("#view").innerHTML = tab === "exp" ? listView() : settleView();
}
function listView(){
  if (!S.expenses.length) return `<div class="card empty"><b>Add your first expense</b>Take a photo of a check or pick one from your library, say who paid and how it splits. Or add one with no receipt.</div>`;
  const rows = [...S.expenses].sort((a, b) => b.ts - a.ts).map(e => {
    const th = e.thumb ? `<img class="th" alt="" src="${e.thumb}">` : `<div class="th">$</div>`;
    const split = e.items.some(i => i.who && i.who.length) ? "By item" : ((e.who && e.who.length && e.who.length < S.people.length) ? `${e.who.length} ways` : "Split equally");
    const payer = S.people.includes(e.payer) ? `${esc(e.payer)} paid` : `<span class="tag">Needs payer</span>`;
    return `<button class="card exp" data-act="edit" data-id="${e.id}">${th}<div style="min-width:0"><div class="t">${esc(e.title || "Expense")}</div><div class="m">${payer} · ${split}</div></div><div class="a">${fmt(e.totalC)}</div></button>`;
  }).join("");
  return `<div class="list">${rows}</div>`;
}
function summaryText(b){
  if (!b.xf.length) return "All square. Nobody owes anything.";
  return "Trip settle-up:\n" + b.xf.map(x => `${x.from} pays ${x.to} ${fmt(x.c)}`).join("\n");
}
function settleView(){
  const b = balances(), P = S.people;
  const missing = S.expenses.filter(e => !P.includes(e.payer)).length;
  const people = P.map(p => `<div class="row"><div><div class="n">${esc(p)}</div><div class="d">Paid ${fmt(b.paid[p])} · Share ${fmt(b.share[p])}</div></div><div class="net ${b.net[p] > 0 ? "pos" : b.net[p] < 0 ? "neg" : ""}">${b.net[p] > 0 ? "gets back " : b.net[p] < 0 ? "owes " : ""}${fmt(Math.abs(b.net[p]))}</div></div>`).join("");
  const xf = b.xf.length ? b.xf.map(x => `<div class="card xfer"><div class="who">${esc(x.from)} <span style="color:var(--muted)">pays</span> ${esc(x.to)}</div><div class="amt">${fmt(x.c)}</div></div>`).join("") : `<div class="card empty">${S.expenses.length ? "All square." : "Add expenses to see who owes what."}</div>`;
  return `${missing ? `<div class="banner warn">${missing} expense${missing > 1 ? "s have" : " has"} no payer and ${missing > 1 ? "are" : "is"} left out. Tap them on the Expenses tab.</div>` : ""}
  <div class="sec">Who pays whom</div><div class="list">${xf}</div>
  <div class="sec">Everyone's balance</div><div class="card">${people}</div>
  <div class="sec">Message for the group chat</div>
  <textarea class="out" id="sumTxt" readonly>${esc(summaryText(b))}</textarea>
  <button class="btn" style="margin-top:8px;width:100%" data-act="copysum">Copy</button>`;
}

/* ---------- toast / sheet helpers ---------- */
let tt;
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 3200); }
let sheetKind = null, lastKind = null;
function openSheet(html){
  const old = $(".sheet"), top = old && lastKind === sheetKind ? old.scrollTop : 0;
  $("#layer").innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  lastKind = sheetKind;
  if (top) $(".sheet").scrollTop = top;
}
function closeSheet(){ $("#layer").innerHTML = ""; add = null; D = null; lastKind = null; }
const chips = (names, sel, act, sm) => names.map(n => `<button type="button" class="chip${sm ? " sm" : ""}${sel.includes(n) ? " on" : ""}" data-act="${act}" data-v="${esc(n)}">${esc(n)}</button>`).join("");

/* ---------- photo prep ---------- */
async function prepImage(file){
  const bmp = await createImageBitmap(file, {imageOrientation: "from-image"});
  const draw = (max, q) => {
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return c;
  };
  const big = draw(1600), blob = await new Promise(r => big.toBlob(r, "image/jpeg", 0.85));
  const thumb = draw(120).toDataURL("image/jpeg", 0.6);
  return {blob, thumb};
}

/* ---------- add sheet ---------- */
let add = null;
function newAdd(queue){ return {photo: null, queue: queue || [], total: queue && queue.length ? queue.length + 1 : 0, payer: null, who: [...S.people], note: "", amount: "", title: "", busy: false}; }
function openAdd(queue){
  add = newAdd(queue);
  const first = add.queue.shift();
  if (first) addPhoto(first); else renderAdd();
}
async function addPhoto(file){
  try { add.photo = await prepImage(file); } catch { toast("Could not read that photo."); }
  renderAdd();
}
function renderAdd(){
  sheetKind = "add";
  const keep = {note: $("#note")?.value ?? add.note, amount: $("#amt")?.value ?? add.amount, title: $("#ttl")?.value ?? add.title};
  Object.assign(add, keep);
  const pos = add.total ? add.total - add.queue.length : 0;
  openSheet(`
    <div class="sheet-head"><h2>Add expense</h2><button class="iconbtn" data-act="close">Close</button></div>
    ${add.total ? `<div class="banner">Receipt ${pos} of ${add.total}</div>` : ""}
    <div class="photos">
      <button class="btn" data-act="cam">Take photo</button>
      <button class="btn" data-act="lib">From library</button>
      <input id="camIn" type="file" accept="image/*" capture="environment" hidden>
      <input id="libIn" type="file" accept="image/*" multiple hidden>
    </div>
    ${add.photo ? `<div class="prev"><img alt="Receipt" src="${add.photo.thumb}"><div><div style="font-weight:600">Receipt attached</div><button class="btn" style="padding:4px 10px;margin-top:4px" data-act="rmphoto">Remove</button></div></div>` : `<div class="hint" style="margin-top:8px">No receipt? Skip the photo and type a total.</div>`}
    <div class="field"><span class="lbl">Paid by</span><div class="chips">${chips(S.people, add.payer ? [add.payer] : [], "payer")}</div></div>
    <div class="field"><span class="lbl">Split among</span><div class="chips">${chips(S.people, add.who, "who")}</div></div>
    <div class="field"><label class="lbl" for="note">What happened (optional)</label>
      <textarea id="note" rows="3" placeholder="e.g. Dad paid, I got the lemon chicken and the cocktail. Or: split equally.">${esc(add.note)}</textarea><div class="hint">With a note, Claude reads it and you confirm on the next screen. For a plain equal split, leave it empty, pick who paid and type the total.</div></div>
    <div class="two">
      <div class="field" style="margin:0"><label class="lbl" for="amt">Total</label><input id="amt" inputmode="decimal" placeholder="from receipt" value="${esc(add.amount)}"></div>
      <div class="field" style="margin:0"><label class="lbl" for="ttl">Title</label><input id="ttl" type="text" placeholder="optional" value="${esc(add.title)}"></div>
    </div>
    <div class="err" id="addErr"></div>
    <button class="primary" id="addGo" data-act="addgo">${add.busy ? `<span class="spin"></span>Reading…` : "Add expense"}</button>`);
  $("#camIn").onchange = e => { if (e.target.files[0]) addPhoto(e.target.files[0]); };
  $("#libIn").onchange = e => {
    const fs = [...e.target.files]; if (!fs.length) return;
    add.queue = fs.slice(1); add.total = fs.length > 1 ? fs.length : 0; addPhoto(fs[0]);
  };
}
function addErr(m){ const el = $("#addErr"); if (el) el.textContent = m; }

/* ---------- AI ---------- */
function buildPrompt(a, hasPhoto){
  const P = S.people;
  return `You read a receipt photo (it may be absent) plus a short note from someone splitting costs on a group trip. Reply with ONLY one JSON object, nothing else.

People: ${JSON.stringify(P)}. The note's author is ${P[0]}: "I", "me", "my" mean ${P[0]}; "dad", "my dad", "father" mean Dad. Use only these exact names.
Note: """${a.note || "(none)"}"""
Chosen in the app: payer = ${a.payer || "not chosen"}; split among = ${JSON.stringify(a.who)}; typed total = ${a.amount || "none"}.
Receipt photo attached: ${hasPhoto ? "yes" : "no"}.

JSON shape:
{"title": short merchant or description, "total": number, "payer": name or null, "participants": [names], "items": [{"name": string, "price": number, "who": [names]}]}

Rules:
- total = the final amount actually charged, including tax, tip and fees. If a tip was handwritten and a final total is written, use that. A typed total overrides the receipt. With no receipt, use the amount in the note or the typed total.
- payer = who paid according to the note or the app choice. null if unknown.
- participants = everyone sharing this expense. Default to everyone chosen in "split among".
- items = the receipt's line items, one per line, price = that line's total before tax and tip. Skip subtotal, tax, tip and total lines. If there is no readable receipt, use [].
- item.who is [] when the item is shared by all participants. Put names in who only when the note says specific people had that item. Match the note's wording to the closest receipt line.
- If the note says some people had specific items and says nothing about the rest, give the remaining items to the participants who did not claim anything (all participants if everyone claimed something).
- If the note says to split equally, leave every item's who as [].`;
}
function parseJson(t){
  const m = t.match(/```(?:json)?\s*([\s\S]*?)```/i); const raw = m ? m[1] : t;
  const s = raw.indexOf("{"), e = raw.lastIndexOf("}");
  if (s < 0 || e < 0) throw {code: "bad_reply"};
  return JSON.parse(raw.slice(s, e + 1));
}
async function askAI(prompt, blob){
  if (SAMPLE){
    try { return await SAMPLE.json(prompt, {images: blob ? [blob] : undefined, cache: false}); }
    catch (e) { throw {code: e.code || "ai_failed"}; }
  }
  const key = LS.get("tcitab.key");
  if (!key) throw {code: "no_key"};
  const content = [];
  if (blob){
    const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });
    content.push({type: "image", source: {type: "base64", media_type: "image/jpeg", data: b64}});
  }
  content.push({type: "text", text: prompt});
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"},
      body: JSON.stringify({model: "claude-sonnet-5-5", max_tokens: 2500, messages: [{role: "user", content}]})
    });
  } catch { throw {code: "network"}; }
  if (res.status === 401) throw {code: "bad_key"};
  if (!res.ok) throw {code: "http_" + res.status};
  const j = await res.json();
  try { return parseJson((j.content || []).map(c => c.text || "").join("")); } catch { throw {code: "bad_reply"}; }
}
const AI_MSG = {
  no_key: "Add your Claude API key in Settings to read receipts. Fill in the details by hand for now.",
  bad_key: "Your Claude API key was rejected. Check it in Settings.",
  network: "No connection to Claude. Fill in the details by hand, or try again.",
  not_granted: "Claude access was not allowed for this page. Fill in the details by hand.",
  rate_limited: "Claude is rate limited right now. Fill in the details by hand, or try again in a minute.",
  bad_reply: "Could not read that receipt. Fill in the details by hand, or try again."
};

async function submitAdd(){
  if (add.busy) return;
  Object.assign(add, {note: $("#note").value, amount: $("#amt").value, title: $("#ttl").value});
  const note = add.note.trim(), amtC = toC(add.amount), allWho = add.who.length === S.people.length;
  if (!add.who.length) return addErr("Pick at least one person to split among.");
  if (!add.photo && !note){
    if (!amtC) return addErr("Enter a total, or add a photo.");
    if (!add.payer) return addErr("Pick who paid.");
    const e = {id: "e" + Date.now().toString(36), ts: Date.now(), title: add.title.trim() || "Expense", payer: add.payer, totalC: amtC, who: allWho ? [] : [...add.who], items: [], thumb: null, note: ""};
    S.expenses.push(e); S.lastPayer = add.payer; save(); nextOrClose(); toast("Added " + fmt(amtC)); return;
  }
  add.busy = true; renderAdd();
  let ai = null, errCode = null;
  try { ai = await askAI(buildPrompt(add, !!add.photo), add.photo && add.photo.blob); }
  catch (e) { errCode = e.code || "bad_reply"; }
  const d = draftFrom(ai, add);
  const queue = add.queue, total = add.total;
  closeSheet();
  openEdit(d, {queue, total, msg: errCode ? (AI_MSG[errCode] || AI_MSG.bad_reply) : null, fromAi: !!ai});
}
function nextOrClose(queue, total){
  const q = queue ?? add?.queue ?? [], t = total ?? add?.total ?? 0;
  closeSheet();
  if (q.length){ openAdd(q); add.total = t; renderAdd(); }
}
function draftFrom(ai, a){
  const P = S.people, nm = n => P.find(p => p.toLowerCase() === String(n || "").toLowerCase());
  const nms = arr => (Array.isArray(arr) ? arr : []).map(nm).filter(Boolean);
  let who = a.who.length === P.length ? nms(ai && ai.participants) : [...a.who];
  if (who.length === P.length) who = [];
  const items = ((ai && ai.items) || []).filter(i => i && i.name != null).map(i => {
    let w = nms(i.who); if (w.length === P.length) w = [];
    return {name: String(i.name), priceStr: (Number(i.price) || 0).toFixed(2), who: w};
  });
  const tot = a.amount ? a.amount : (ai && Number(ai.total) > 0 ? Number(ai.total).toFixed(2) : "");
  return {id: null, title: a.title.trim() || (ai && ai.title) || "Expense", payer: a.payer || nm(ai && ai.payer) || null, totalStr: tot, who, items, thumb: a.photo ? a.photo.thumb : null, note: a.note.trim()};
}

/* ---------- edit / review sheet ---------- */
let D = null, DOPT = {};
function openEdit(d, opt){ D = d; DOPT = opt || {}; renderEdit(); }
function edit(id){
  const e = S.expenses.find(x => x.id === id); if (!e) return;
  openEdit({id: e.id, title: e.title, payer: e.payer, totalStr: (e.totalC / 100).toFixed(2), who: [...(e.who || [])], thumb: e.thumb, note: e.note || "", ts: e.ts,
    items: e.items.map(i => ({name: i.name, priceStr: (i.priceC / 100).toFixed(2), who: [...(i.who || [])]}))}, {});
}
function draftToExpense(){
  return {totalC: toC(D.totalStr), who: D.who, items: D.items.filter(i => i.name.trim() || toC(i.priceStr)).map(i => ({name: i.name.trim(), priceC: toC(i.priceStr), who: i.who}))};
}
function sharesHtml(){
  const e = draftToExpense();
  if (e.totalC <= 0) return `<div class="hint" style="padding:12px 14px">Enter a total to see each person's share.</div>`;
  const sh = shares(e), sum = e.items.reduce((a, i) => a + i.priceC, 0), extra = e.totalC - sum;
  const note = e.items.length ? (extra ? `<div class="hint" style="grid-column:1/-1">Tax, tip and fees of ${fmt(extra)} are shared in proportion to each person's items.</div>` : "") : "";
  const warn = e.items.length && extra < 0 ? `<div class="hint neg" style="grid-column:1/-1">Items add up to more than the total. Check the prices.</div>` : "";
  return S.people.map(p => `<div>${esc(p)}</div><div style="font-weight:700;text-align:right">${fmt(sh[p])}</div>`).join("") + note + warn;
}
function renderEdit(){
  sheetKind = "edit";
  const P = S.people;
  const items = D.items.map((it, i) => `
    <div class="card item"><div class="r"><input type="text" aria-label="Item name" data-f="iname" data-i="${i}" value="${esc(it.name)}" placeholder="Item"><input inputmode="decimal" aria-label="Item price" data-f="iprice" data-i="${i}" value="${esc(it.priceStr)}" placeholder="0.00"><button class="x" data-act="rmitem" data-i="${i}" aria-label="Remove item">×</button></div>
    <div class="chips">${P.map(p => `<button type="button" class="chip sm${it.who.includes(p) ? " on" : ""}" data-act="itemwho" data-i="${i}" data-v="${esc(p)}">${esc(p)}</button>`).join("")}${it.who.length ? "" : `<span class="hint" style="align-self:center">Shared</span>`}</div></div>`).join("");
  const isNew = !D.id;
  openSheet(`
    <div class="sheet-head"><h2>${DOPT.fromAi ? "Check this" : isNew ? "New expense" : "Edit expense"}</h2><button class="iconbtn" data-act="close">${isNew && DOPT.queue ? "Discard" : "Close"}</button></div>
    ${DOPT.msg ? `<div class="banner warn">${esc(DOPT.msg)}</div>` : ""}
    ${DOPT.fromAi ? `<div class="banner">Claude read the receipt and your note. Fix anything that looks off, then save.</div>` : ""}
    ${D.thumb ? `<div class="prev"><img alt="Receipt" src="${D.thumb}"></div>` : ""}
    <div class="two" style="margin-top:12px">
      <div class="field" style="margin:0"><label class="lbl" for="eTtl">Title</label><input id="eTtl" type="text" data-f="title" value="${esc(D.title)}"></div>
      <div class="field" style="margin:0"><label class="lbl" for="eTot">Total paid</label><input id="eTot" inputmode="decimal" data-f="total" value="${esc(D.totalStr)}" placeholder="0.00"></div>
    </div>
    <div class="field"><span class="lbl">Paid by</span><div class="chips">${chips(P, D.payer ? [D.payer] : [], "epayer")}</div></div>
    <div class="field"><span class="lbl">Shared by (for anything not assigned below)</span><div class="chips">${chips(P, D.who.length ? D.who : P, "ewho")}</div></div>
    <div class="sec" style="margin-top:6px">Items</div>
    <div class="hint" style="margin:-4px 2px 8px">Tap names to say who had an item. No names means it is shared.</div>
    ${items || `<div class="hint" style="margin-bottom:8px">No items. The total is split equally among the people above.</div>`}
    <button class="btn" data-act="additem">+ Add item</button>
    <div class="sec">Each person's share</div>
    <div class="card shares" id="shares">${sharesHtml()}</div>
    <div class="err" id="eErr"></div>
    <button class="primary" data-act="esave">Save</button>
    ${isNew ? "" : `<button class="btn danger" style="width:100%;margin-top:10px" data-act="edel" id="delBtn">Delete expense</button>`}`);
}

/* ---------- settings ---------- */
function openSettings(){
  sheetKind = "settings";
  const hasKeyBox = !SAMPLE;
  openSheet(`
    <div class="sheet-head"><h2>Settings</h2><button class="iconbtn" data-act="close">Close</button></div>
    <div class="field"><span class="lbl">People (first one is you)</span>
      ${S.people.map((p, i) => `<input type="text" aria-label="Person ${i + 1}" data-f="pname" data-i="${i}" value="${esc(p)}" style="margin-bottom:6px">`).join("")}
      <div class="hint">Renaming updates every expense.</div></div>
    ${hasKeyBox ? `<div class="field"><label class="lbl" for="key">Claude API key</label><input id="key" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-…" value="${esc(LS.get("tcitab.key") || "")}"><div class="hint">Stored only on this phone. Used to read receipts.</div></div>` : ""}
    <button class="primary" data-act="savesettings">Save settings</button>
    <div class="sec">Backup</div>
    <button class="btn" style="width:100%" data-act="backup">Show backup text</button>
    <textarea class="out" id="bk" placeholder="Paste a backup here to restore it" style="margin-top:8px"></textarea>
    <button class="btn" style="width:100%;margin-top:8px" data-act="restore">Restore from pasted backup</button>
    <button class="btn danger" style="width:100%;margin-top:16px" data-act="wipe" id="wipeBtn">Delete all expenses</button>`);
}

/* ---------- events ---------- */
let confirmDel = null;
document.addEventListener("input", e => {
  const f = e.target.dataset && e.target.dataset.f; if (!f) return;
  const i = +e.target.dataset.i;
  if (f === "title") D.title = e.target.value;
  else if (f === "total") D.totalStr = e.target.value;
  else if (f === "iname") D.items[i].name = e.target.value;
  else if (f === "iprice") D.items[i].priceStr = e.target.value;
  if (D && f !== "pname"){ const s = $("#shares"); if (s) s.innerHTML = sharesHtml(); }
});
const toggle = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, i = +el.dataset.i;
  if (a === "scrim"){ if (e.target === el && !(add && add.busy)) closeSheet(); return; }
  switch (a){
    case "tab": tab = v; render(); break;
    case "add": openAdd(); break;
    case "close": closeSheet(); break;
    case "settings": openSettings(); break;
    case "cam": $("#camIn").click(); break;
    case "lib": $("#libIn").click(); break;
    case "rmphoto": add.photo = null; renderAdd(); break;
    case "payer": add.payer = add.payer === v ? null : v; renderAdd(); break;
    case "who": add.who = toggle(add.who, v); renderAdd(); break;
    case "addgo": submitAdd(); break;
    case "edit": edit(el.dataset.id); break;
    case "epayer": D.payer = D.payer === v ? null : v; renderEdit(); break;
    case "ewho": { const cur = D.who.length ? D.who : [...S.people]; let n = toggle(cur, v); if (!n.length) n = cur; D.who = n.length === S.people.length ? [] : n; renderEdit(); break; }
    case "itemwho": { const it = D.items[i]; it.who = toggle(it.who, v); if (it.who.length === S.people.length) it.who = []; renderEdit(); break; }
    case "additem": D.items.push({name: "", priceStr: "", who: []}); renderEdit(); break;
    case "rmitem": D.items.splice(i, 1); renderEdit(); break;
    case "esave": saveEdit(); break;
    case "edel":
      if (confirmDel !== D.id){ confirmDel = D.id; el.textContent = "Tap again to delete"; break; }
      S.expenses = S.expenses.filter(x => x.id !== D.id); confirmDel = null; save(); closeSheet(); render(); toast("Deleted"); break;
    case "copysum": copyText($("#sumTxt").value); break;
    case "savesettings": saveSettings(); break;
    case "backup": { const t = $("#bk"); t.value = JSON.stringify(S); t.select(); copyText(t.value, true); break; }
    case "restore": try { const s = JSON.parse($("#bk").value); if (!s.people || !s.expenses) throw 0; S = s; save(); closeSheet(); render(); toast("Restored"); } catch { toast("That does not look like a backup."); } break;
    case "wipe":
      if (!el.dataset.armed){ el.dataset.armed = "1"; el.textContent = "Tap again to delete everything"; break; }
      S.expenses = []; save(); closeSheet(); render(); toast("All expenses deleted"); break;
  }
});
async function copyText(t, quiet){
  try { await navigator.clipboard.writeText(t); toast("Copied"); }
  catch { const x = $("#sumTxt") || $("#bk"); if (x){ x.focus(); x.select(); } if (!quiet) toast("Press and hold the text to copy"); }
}
function saveEdit(){
  const e = draftToExpense();
  if (e.totalC <= 0){ $("#eErr").textContent = "Enter the total paid."; return; }
  const rec = {id: D.id || "e" + Date.now().toString(36), ts: D.ts || Date.now(), title: D.title.trim() || "Expense", payer: D.payer, totalC: e.totalC, who: e.who, items: e.items, thumb: D.thumb, note: D.note || ""};
  const idx = S.expenses.findIndex(x => x.id === rec.id);
  if (idx >= 0) S.expenses[idx] = rec; else S.expenses.push(rec);
  if (rec.payer) S.lastPayer = rec.payer;
  save();
  const q = DOPT.queue || [], t = DOPT.total || 0;
  closeSheet(); render(); toast("Saved " + fmt(rec.totalC));
  if (q.length){ openAdd(q); add.total = t; renderAdd(); }
}
function saveSettings(){
  const names = [...document.querySelectorAll('[data-f="pname"]')].map(x => x.value.trim());
  if (names.some(n => !n) || new Set(names.map(n => n.toLowerCase())).size !== names.length){ toast("Each person needs a different name."); return; }
  const map = Object.fromEntries(S.people.map((p, i) => [p, names[i]]));
  const m = arr => (arr || []).map(x => map[x] || x);
  S.expenses.forEach(e => { e.payer = map[e.payer] || e.payer; e.who = m(e.who); e.items.forEach(i => { i.who = m(i.who); }); });
  S.people = names; if (S.lastPayer) S.lastPayer = map[S.lastPayer] || S.lastPayer;
  const k = $("#key"); if (k) LS.set("tcitab.key", k.value.trim());
  save(); closeSheet(); render(); toast("Saved");
}

render();
loadDb();
(async () => {
  try {
    if (window.claude){
      const s = await window.claude.use("sample");
      if (s){ const lim = await s.limits().catch(() => null); if (lim && lim.images) SAMPLE = s; }
    }
  } catch {}
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script>
